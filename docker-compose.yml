services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-appointment:
    image: postgres:16
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: appointment
    ports:
      - "5433:5432"
    volumes:
      - pg_appt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointmentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-doctor:
    image: postgres:16
    environment:
      POSTGRES_DB: doctordb
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
    ports:
      - "5434:5432"
    volumes:
      - pg_doctor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctordb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5435:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-patient:
    image: postgres:16
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
    ports:
      - "5436:5432"
    volumes:
      - pg_patient_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patientdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-telemedicine:
    image: postgres:16
    environment:
      POSTGRES_DB: telemedicinedb
      POSTGRES_USER: telemedicine
      POSTGRES_PASSWORD: telemedicine
    ports:
      - "5437:5432"
    volumes:
      - pg_telemedicine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemedicine -d telemedicinedb"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  service-discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: service-discovery
    image: medilink/service-discovery:0.1.0
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    image: medilink/auth-service:0.1.0
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SECURITY_JWT_SECRET: "change-me-to-a-long-32bytes-min-secret-change-me"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-auth:5432/authdb"
      SPRING_DATASOURCE_USERNAME: "auth"
      SPRING_DATASOURCE_PASSWORD: "auth"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-auth:
        condition: service_healthy

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: patient-service
    image: medilink/patient-service:0.1.0
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-patient:5432/patientdb"
      SPRING_DATASOURCE_USERNAME: "patient"
      SPRING_DATASOURCE_PASSWORD: "patient"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-patient:
        condition: service_healthy

  doctor-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: doctor-service
    image: medilink/doctor-service:0.1.0
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-doctor:5432/doctordb"
      SPRING_DATASOURCE_USERNAME: "doctor"
      SPRING_DATASOURCE_PASSWORD: "doctor"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-doctor:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: appointment-service
    image: medilink/appointment-service:0.1.0
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      APP_DOCTOR_BASE_URL: "http://doctor-service:8084"
      APP_PATIENT_BASE_URL: "http://patient-service:8086"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-appointment:5432/appointmentdb"
      SPRING_DATASOURCE_USERNAME: "appointment"
      SPRING_DATASOURCE_PASSWORD: "appointment"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-appointment:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-service
    image: medilink/payment-service:0.1.0
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-payment:5432/paymentdb"
      SPRING_DATASOURCE_USERNAME: "payment"
      SPRING_DATASOURCE_PASSWORD: "payment"
      APP_GATEWAY_BASE_URL: "${APP_GATEWAY_BASE_URL:-http://api-gateway:8090}"
      PAYHERE_MERCHANT_ID: "${PAYHERE_MERCHANT_ID:-1211149}"
      PAYHERE_MERCHANT_SECRET: "${PAYHERE_MERCHANT_SECRET:-change-me}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    image: medilink/notification-service:0.1.0
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  telemedicine-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: telemedicine-service
    image: medilink/telemedicine-service:0.1.0
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: "8087"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-telemedicine:5432/telemedicinedb"
      SPRING_DATASOURCE_USERNAME: "telemedicine"
      SPRING_DATASOURCE_PASSWORD: "telemedicine"
      APP_TELEMEDICINE_JITSI_DOMAIN: "meet.jit.si"
      APP_TELEMEDICINE_JOIN_TOKEN_SECRET: "change-me-to-a-long-telemedicine-join-token-secret"
      APP_TELEMEDICINE_JOIN_TOKEN_TTL_MINUTES: "15"
      APP_TELEMEDICINE_JOIN_WINDOW_BEFORE_MINUTES: "10"
      APP_TELEMEDICINE_JOIN_WINDOW_AFTER_MINUTES: "60"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-telemedicine:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    image: medilink/api-gateway:0.1.0
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SECURITY_JWT_SECRET: "change-me-to-a-long-32bytes-min-secret-change-me"
    depends_on:
      service-discovery:
        condition: service_started
      auth-service:
        condition: service_started
      appointment-service:
        condition: service_started
      doctor-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      patient-service:
        condition: service_started
      telemedicine-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    image: medilink/frontend:0.1.0
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  pg_auth_data:
  pg_appt_data:
  pg_doctor_data:
  pg_payment_data:
  pg_patient_data:
  pg_telemedicine_data:
  rabbitmq_data:
