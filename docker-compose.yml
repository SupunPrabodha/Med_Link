services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-appointment:
    image: postgres:16
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: appointment
    ports:
      - "5433:5432"
    volumes:
      - pg_appt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointmentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-doctor:
    image: postgres:16
    environment:
      POSTGRES_DB: doctordb
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
    ports:
      - "5434:5432"
    volumes:
      - pg_doctor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctordb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5435:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-patient:
    image: postgres:16
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
    ports:
      - "5436:5432"
    volumes:
      - pg_patient_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patientdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-telemedicine:
    image: postgres:16
    environment:
      POSTGRES_DB: telemedicinedb
      POSTGRES_USER: telemedicine
      POSTGRES_PASSWORD: telemedicine
    ports:
      - "5437:5432"
    volumes:
      - pg_telemedicine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemedicine -d telemedicinedb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-prescription:
    image: postgres:16
    environment:
      POSTGRES_DB: prescriptiondb
      POSTGRES_USER: prescription
      POSTGRES_PASSWORD: prescription
    ports:
      - "5438:5432"
    volumes:
      - pg_prescription_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prescription -d prescriptiondb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5439:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-symptom:
    image: postgres:16
    environment:
      POSTGRES_DB: symptomdb
      POSTGRES_USER: symptom
      POSTGRES_PASSWORD: symptom
    ports:
      - "5440:5432"
    volumes:
      - pg_symptom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symptom -d symptomdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-symptom-service:
    build:
      context: ./ai-symptom-service
      dockerfile: Dockerfile
    image: medilink/ai-symptom-service:0.1.0
    ports:
      - "8010:8000"
    environment:
      AI_API_KEY: "${AI_SYMPTOM_API_KEY:-}"
      AI_MODEL_PATH: "${AI_SYMPTOM_MODEL_PATH:-/models/model.joblib}"
      AI_MODEL_VERSION: "${AI_SYMPTOM_MODEL_VERSION:-dev}"
      AI_DATASET_NAME: "${AI_SYMPTOM_DATASET_NAME:-}"
      AI_OUTPUT_KIND: "${AI_SYMPTOM_OUTPUT_KIND:-specialty}"
      AI_DISEASE_TO_SPECIALTY_PATH: "${AI_SYMPTOM_DISEASE_MAP_PATH:-/models/disease_to_specialty.json}"
    volumes:
      - ai_symptom_models:/models

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  service-discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: service-discovery
    image: medilink/service-discovery:0.1.0
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    image: medilink/auth-service:0.1.0
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SECURITY_JWT_SECRET: "change-me-to-a-long-32bytes-min-secret-change-me"
      APP_INTERNAL_TOKEN: "${INTERNAL_API_TOKEN:-change-me-internal-token}"
      SPRING_DATASOURCE_URL: "${AUTH_DB_URL:-jdbc:postgresql://postgres-auth:5432/authdb}"
      SPRING_DATASOURCE_USERNAME: "${AUTH_DB_USER:-auth}"
      SPRING_DATASOURCE_PASSWORD: "${AUTH_DB_PASS:-auth}"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-auth:
        condition: service_healthy

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: patient-service
    image: medilink/patient-service:0.1.0
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      APP_CLOUDINARY_URL: "${APP_CLOUDINARY_URL:-}"
      APP_INTERNAL_TOKEN: "${INTERNAL_API_TOKEN:-change-me-internal-token}"
      SPRING_DATASOURCE_URL: "${PATIENT_DB_URL:-jdbc:postgresql://postgres-patient:5432/patientdb}"
      SPRING_DATASOURCE_USERNAME: "${PATIENT_DB_USER:-patient}"
      SPRING_DATASOURCE_PASSWORD: "${PATIENT_DB_PASS:-patient}"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-patient:
        condition: service_healthy

  doctor-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: doctor-service
    image: medilink/doctor-service:0.1.0
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      APP_CLOUDINARY_URL: "${APP_CLOUDINARY_URL:-}"
      APP_INTERNAL_TOKEN: "${INTERNAL_API_TOKEN:-change-me-internal-token}"
      SPRING_DATASOURCE_URL: "${DOCTOR_DB_URL:-jdbc:postgresql://postgres-doctor:5432/doctordb}"
      SPRING_DATASOURCE_USERNAME: "${DOCTOR_DB_USER:-doctor}"
      SPRING_DATASOURCE_PASSWORD: "${DOCTOR_DB_PASS:-doctor}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-doctor:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: appointment-service
    image: medilink/appointment-service:0.1.0
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      APP_DOCTOR_BASE_URL: "http://doctor-service:8084"
      APP_PATIENT_BASE_URL: "http://patient-service:8086"
      SPRING_DATASOURCE_URL: "${APPOINTMENT_DB_URL:-jdbc:postgresql://postgres-appointment:5432/appointmentdb}"
      SPRING_DATASOURCE_USERNAME: "${APPOINTMENT_DB_USER:-appointment}"
      SPRING_DATASOURCE_PASSWORD: "${APPOINTMENT_DB_PASS:-appointment}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-appointment:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-service
    image: medilink/payment-service:0.1.0
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_DATASOURCE_URL: "${PAYMENT_DB_URL:-jdbc:postgresql://postgres-payment:5432/paymentdb}"
      SPRING_DATASOURCE_USERNAME: "${PAYMENT_DB_USER:-payment}"
      SPRING_DATASOURCE_PASSWORD: "${PAYMENT_DB_PASS:-payment}"
      APP_APPOINTMENT_BASE_URL: "${APP_APPOINTMENT_BASE_URL:-http://appointment-service:8082}"
      APP_PATIENT_BASE_URL: "${APP_PATIENT_BASE_URL:-http://patient-service:8086}"
      APP_GATEWAY_BASE_URL: "${APP_GATEWAY_BASE_URL:-http://localhost:8090}"
      APP_FRONTEND_BASE_URL: "${APP_FRONTEND_BASE_URL:-http://localhost:5173}"
      PAYHERE_MERCHANT_ID: "${PAYHERE_MERCHANT_ID:-1211149}"
      PAYHERE_MERCHANT_SECRET: "${PAYHERE_MERCHANT_SECRET:-change-me}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    image: medilink/notification-service:0.1.0
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_DATASOURCE_URL: "${NOTIFICATION_DB_URL:-jdbc:postgresql://postgres-notification:5432/notificationdb}"
      SPRING_DATASOURCE_USERNAME: "${NOTIFICATION_DB_USER:-notification}"
      SPRING_DATASOURCE_PASSWORD: "${NOTIFICATION_DB_PASS:-notification}"
      APP_INTERNAL_TOKEN: "${INTERNAL_API_TOKEN:-change-me-internal-token}"
      APP_AUTH_BASE_URL: "http://auth-service:8081"
      APP_PATIENT_BASE_URL: "http://patient-service:8086"
      APP_DOCTOR_BASE_URL: "http://doctor-service:8084"
      APP_BREVO_API_KEY: "${BREVO_API_KEY:-}"
      APP_BREVO_FROM_EMAIL: "${BREVO_FROM_EMAIL:-}"
      APP_BREVO_FROM_NAME: "${BREVO_FROM_NAME:-MediLink LK}"
      APP_TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      APP_TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      APP_TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy

  prescription-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: prescription-service
    image: medilink/prescription-service:0.1.0
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: "8088"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_DATASOURCE_URL: "${PRESCRIPTION_DB_URL:-jdbc:postgresql://postgres-prescription:5432/prescriptiondb}"
      SPRING_DATASOURCE_USERNAME: "${PRESCRIPTION_DB_USER:-prescription}"
      SPRING_DATASOURCE_PASSWORD: "${PRESCRIPTION_DB_PASS:-prescription}"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-prescription:
        condition: service_healthy

  telemedicine-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: telemedicine-service
    image: medilink/telemedicine-service:0.1.0
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: "8087"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      APP_JITSI_BASE_URL: "${APP_JITSI_BASE_URL:-https://meet.jit.si}"
      APP_DOCTOR_BASE_URL: "${APP_DOCTOR_BASE_URL:-http://doctor-service:8084}"
      SPRING_DATASOURCE_URL: "${TELEMEDICINE_DB_URL:-jdbc:postgresql://postgres-telemedicine:5432/telemedicinedb}"
      SPRING_DATASOURCE_USERNAME: "${TELEMEDICINE_DB_USER:-telemedicine}"
      SPRING_DATASOURCE_PASSWORD: "${TELEMEDICINE_DB_PASS:-telemedicine}"
    depends_on:
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres-telemedicine:
        condition: service_healthy

  symptom-checker-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: symptom-checker-service
    image: medilink/symptom-checker-service:0.1.0
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SPRING_DATASOURCE_URL: "${SYMPTOM_DB_URL:-jdbc:postgresql://postgres-symptom:5432/symptomdb}"
      SPRING_DATASOURCE_USERNAME: "${SYMPTOM_DB_USER:-symptom}"
      SPRING_DATASOURCE_PASSWORD: "${SYMPTOM_DB_PASS:-symptom}"
      APP_AI_ENABLED: "${AI_SYMPTOM_ENABLED:-false}"
      APP_AI_BASE_URL: "${AI_SYMPTOM_BASE_URL:-http://ai-symptom-service:8000}"
      APP_AI_API_KEY: "${AI_SYMPTOM_API_KEY:-}"
      APP_AI_MODEL: "${AI_SYMPTOM_MODEL:-}"
    depends_on:
      service-discovery:
        condition: service_started
      postgres-symptom:
        condition: service_healthy
      ai-symptom-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    image: medilink/api-gateway:0.1.0
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka"
      SECURITY_JWT_SECRET: "change-me-to-a-long-32bytes-min-secret-change-me"
    depends_on:
      service-discovery:
        condition: service_started
      auth-service:
        condition: service_started
      appointment-service:
        condition: service_started
      doctor-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      prescription-service:
        condition: service_started
      symptom-checker-service:
        condition: service_started
      patient-service:
        condition: service_started
      telemedicine-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    image: medilink/frontend:0.1.0
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  pg_auth_data:
  pg_appt_data:
  pg_doctor_data:
  pg_payment_data:
  pg_patient_data:
  pg_telemedicine_data:
  pg_prescription_data:
  pg_notification_data:
  pg_symptom_data:
  rabbitmq_data:
  ai_symptom_models:
