apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medilink-ingress
  namespace: medilink
spec:
  rules:
    - host: medilink.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
