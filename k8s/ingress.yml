apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medilink-ingress
  namespace: medilink
spec:
  rules:
    - host: medilink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

