apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: medilink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: medilink/service-discovery:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: medilink
spec:
  selector:
    app: service-discovery
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: medilink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: medilink/auth-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: medilink-config
                  key: EUREKA_URL
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medilink-secrets
                  key: JWT_SECRET
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: medilink-secrets
                  key: AUTH_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medilink-secrets
                  key: AUTH_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilink-secrets
                  key: AUTH_DB_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medilink
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
