spring:
  application:
    name: telemedicine-service
  datasource:
    url: jdbc:postgresql://localhost:5437/telemedicinedb
    username: telemedicine
    password: telemedicine
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
