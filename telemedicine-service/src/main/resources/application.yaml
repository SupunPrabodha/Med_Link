spring:
  application:
    name: telemedicine-service
  datasource:
    url: jdbc:postgresql://localhost:5437/telemedicinedb
    username: telemedicine
    password: telemedicine
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  telemedicine:
    jitsi-domain: meet.jit.si
    join-token-secret: change-me-to-a-long-telemedicine-join-token-secret
    join-token-ttl-minutes: 15
    join-window-before-minutes: 10
    join-window-after-minutes: 60

server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
