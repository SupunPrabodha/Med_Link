server:
  # Default to 8090 to avoid port clashes on lab machines.
  # Override with: --server.port=8080 (or set SERVER_PORT)
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","ADMIN"]
        - id: appointment-admin
          uri: lb://appointment-service
          predicates:
            - Path=/api/admin/appointments/**
          filters:
            - StripPrefix=2
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["ADMIN"]

security:
  jwt:
    # For demos only. Replace via env var in real deployments.
    secret: "change-me-to-a-long-32bytes-min-secret-change-me"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info
