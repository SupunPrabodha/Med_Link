server:
  # Default to 8090 to avoid port clashes on lab machines.
  # Override with: --server.port=8080 (or set SERVER_PORT)
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","ADMIN"]
        - id: payhere-callback
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/callback/payhere
        - id: appointment-doctor-view
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/doctor/me
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["DOCTOR"]
        - id: appointment-doctor-actions
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/doctor/me/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["DOCTOR"]
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","ADMIN"]
        - id: appointment-admin
          uri: lb://appointment-service
          predicates:
            - Path=/api/admin/appointments,/api/admin/appointments/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["ADMIN"]
        - id: auth-admin
          uri: lb://auth-service
          predicates:
            - Path=/api/admin/users,/api/admin/users/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["ADMIN"]
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/doctors/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","DOCTOR","ADMIN"]
        - id: doctor-admin
          uri: lb://doctor-service
          predicates:
            - Path=/api/admin/doctors/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["ADMIN"]
        - id: telemedicine-service
          uri: lb://telemedicine-service
          predicates:
            - Path=/api/telemedicine/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","DOCTOR","ADMIN"]
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - name: JwtAuthGatewayFilter
              args:
                requiredRoles: ["PATIENT","ADMIN"]

security:
  jwt:
    # For demos only. Replace via env var in real deployments.
    secret: "change-me-to-a-long-32bytes-min-secret-change-me"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info
