server:
  port: 8086

spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:postgresql://localhost:5436/patientdb
    username: patient
    password: patient
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

